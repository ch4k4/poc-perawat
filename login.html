<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Klinik Sehat Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00a896; --dark: #2d3436; --light: #f4f7f6; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--light); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-card { background: white; width: 90%; max-width: 380px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 40px 30px; text-align: center; }
        .logo-area { background: #e0f2f1; width: 70px; height: 70px; border-radius: 20px; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; transform: rotate(-10deg); }
        .logo-area svg { fill: var(--primary); width: 40px; height: 40px; transform: rotate(10deg); }
        
        h2 { color: var(--dark); margin: 0 0 5px; font-size: 24px; }
        p { color: #636e72; font-size: 13px; margin-bottom: 30px; }

        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #b2bec3; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 14px; border: 2px solid #edf2f7; border-radius: 12px; box-sizing: border-box; font-size: 14px; transition: 0.3s; outline: none; }
        input:focus { border-color: var(--primary); background: #f0fdfa; }

        .btn-login { background: var(--primary); color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px; box-shadow: 0 8px 20px rgba(0,168,150,0.2); }
        .btn-login:hover { background: #008f81; transform: translateY(-2px); }
        .btn-login:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

        #errorMessage { color: #d63031; font-size: 12px; margin-top: 15px; display: none; background: #fff5f5; padding: 10px; border-radius: 8px; }
        
        .loader { width: 18px; height: 18px; border: 2px solid white; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; margin-right: 10px; vertical-align: middle; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo-area">
        <svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M17,13H13V17H11V13H7V11H11V7H13V11H17V13Z"/></svg>
    </div>
    <h2>Login Sistem</h2>
    <p>Gunakan akun Anda untuk akses dashboard.</p>

    <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="Masukkan username">
    </div>

    <div class="form-group">
        <label>Kata Sandi</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <button id="btnLogin" class="btn-login" onclick="handleLogin()">MASUK KE SISTEM</button>
    
    <div id="errorMessage"></div>
</div>

<script>
    // 1. GANTI DENGAN URL WEB APP ANDA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwd_WAWGaqav6lOCT24-LUDiCH2rcDhMnOZl55WQpSb2Kc20X976l2Hc1t6rySfXgdu/exec";

    async function handleLogin() {
        const u = document.getElementById('username').value;
        const p = document.getElementById('password').value;
        const btn = document.getElementById('btnLogin');
        const err = document.getElementById('errorMessage');

        if (!u || !p) {
            showError("Username dan Password wajib diisi!");
            return;
        }

        // UI State: Loading
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span> Memverifikasi...';
        err.style.display = "none";

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Untuk menghindari isu CORS pada PoC
                body: JSON.stringify({
                    action: "login",
                    username: u,
                    password: p
                })
            });

            /* 
               CATATAN: Karena menggunakan 'no-cors', kita tidak bisa membaca response JSON 
               secara langsung dalam mode POST di Apps Script untuk skenario tertentu.
               Solusi alternatif: Kita asumsikan sukses jika fetch berhasil, 
               atau gunakan doGet untuk verifikasi yang lebih ketat.
            */
            
            // Untuk simulasi PoC yang lebih akurat dengan Apps Script:
            // Kita panggil via GET untuk mendapatkan data verifikasi asli
            const checkUrl = `${SCRIPT_URL}?action=getUsers`;
            const checkRes = await fetch(checkUrl);
            const users = await checkRes.json();

            const validUser = users.find(user => user.username === u);

            if (validUser) {
                // Simpan Session ke LocalStorage
                localStorage.setItem('userSession', JSON.stringify({
                    username: validUser.username,
                    nama: validUser.nama,
                    role: validUser.role
                }));

                // Alihkan ke Dashboard
                window.location.href = "dashboard.html";
            } else {
                showError("Username atau Password salah!");
                resetButton();
            }

        } catch (e) {
            showError("Gagal terhubung ke server. Periksa koneksi.");
            resetButton();
        }
    }

    function showError(msg) {
        const err = document.getElementById('errorMessage');
        err.textContent = msg;
        err.style.display = "block";
    }

    function resetButton() {
        const btn = document.getElementById('btnLogin');
        btn.disabled = false;
        btn.textContent = "MASUK KE SISTEM";
    }
</script>

</body>
</html>
