<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinik Sehat - Login Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #eef2f7; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-card { background: white; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); padding: 40px 30px; text-align: center; }
        .icon-box { background: #e0f2f1; width: 80px; height: 80px; border-radius: 50%; display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; }
        .icon-box svg { fill: #00a896; width: 40px; height: 40px; }
        h2 { color: #2d3436; margin: 0 0 10px; font-size: 22px; }
        p { color: #636e72; font-size: 14px; margin-bottom: 30px; line-height: 1.6; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 600; color: #b2bec3; margin-bottom: 8px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; border: 1px solid #dfe6e9; border-radius: 12px; box-sizing: border-box; font-size: 15px; background: #f9f9f9; }
        
        .btn-primary { background: #00a896; color: white; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-primary:hover { background: #008f81; box-shadow: 0 5px 15px rgba(0,168,150,0.3); }
        
        .footer-link { margin-top: 25px; font-size: 13px; color: #b2bec3; }
        .footer-link a { color: #00a896; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="icon-box">
        <svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.89 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5C21,3.89 20.1,3 19,3M17,13H13V17H11V13H7V11H11V7H13V11H17V13Z"/></svg>
    </div>
    <h2>Selamat Datang!</h2>
    <p>Lokasi Anda telah diverifikasi. Silakan masukkan kata sandi untuk mengakses Dashboard Klinik.</p>

    <div class="input-group">
        <label>Kata Sandi</label>
        <input type="password" placeholder="••••••••">
    </div>

    <button class="btn-primary" onclick="alert('Demo Selesai: Ini adalah akhir dari alur PoC Anda.')">LOGIN KE DASHBOARD</button>

    <div class="footer-link">
        Lupa kata sandi? <a href="#">Hubungi IT Klinik</a>
    </div>
</div>

</body>
</html>
