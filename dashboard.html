<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Klinik - Integrated</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; display: flex; height: 100vh; background: #f4f7f6; }
        /* Sidebar Dinamis */
        .sidebar { width: 250px; background: #00a896; color: white; padding: 20px; display: flex; flex-direction: column; }
        .sidebar h2 { font-size: 18px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 15px; }
        .menu-item { color: white; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 5px; transition: 0.3s; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        /* Main Content */
        .main { flex: 1; padding: 30px; overflow-y: auto; }
        .user-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; background: #e0f2f1; color: #00a896; }
    </style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <h2 id="welcomeText">Klinik Sehat</h2>
    <div id="menuContainer">
        <!-- Menu akan muncul otomatis dari Database -->
    </div>
    <a href="index.html" class="menu-item" style="margin-top: auto; background: #c62828;">Logout</a>
</div>

<div class="main">
    <div class="header-dashboard">
        <h3>Portal <span id="userRoleHeader">...</span></h3>
        <p>User: <b id="userName">...</b></p>
    </div>
    
    <!-- Kontainer Dinamis -->
    <div id="contentArea" style="height: calc(100vh - 120px); border-radius: 12px; overflow: hidden;">
        <iframe id="mainFrame" src="about:blank" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>
</div>

<script>
    const SCRIPT_URL = "PASTE_URL_WEB_APP_GOOGLE_ANDA_DI_SINI";
    
    // Ambil data session (Untuk demo, kita simpan di LocalStorage)
    const user = JSON.parse(localStorage.getItem('userSession'));
    
    if (!user) {
        window.location.href = "index.html";
    }

    document.getElementById('userName').textContent = user.nama;
    document.getElementById('userRole').textContent = user.role;

    async function loadMenu() {
        const res = await fetch(`${SCRIPT_URL}?action=getMenu&role=${user.role}`);
        const menus = await res.json();
        const container = document.getElementById('menuContainer');
        const frame = document.getElementById('mainFrame');

        menus.forEach((m, index) => {
            const a = document.createElement('a');
            a.className = 'menu-item';
            a.href = "#"; 
            a.textContent = m.name;
            
            // Logika Klik: Ubah src Iframe
            a.onclick = (e) => {
                e.preventDefault();
                frame.src = m.url; // Mengarah ke admin.html atau modul lainnya
                
                // Efek Aktif pada Menu
                document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
                a.classList.add('active');
            };

            container.appendChild(a);

            // Load menu pertama secara otomatis sebagai default
            if(index === 0) a.click();
        });
    }

    loadMenu();
</script>
</body>
</html>
