<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinik Sehat - Login System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #eef2f7; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { background: white; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: #00a896; color: white; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
        .content { padding: 30px 25px; }
        .input-group { margin-bottom: 25px; text-align: left; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 14px; border: 1px solid #dfe6e9; border-radius: 10px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #00a896; box-shadow: 0 0 0 3px rgba(0,168,150,0.1); }
        
        #btnMasuk { 
            background: #00a896; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            font-weight: 600; 
            font-size: 16px;
            cursor: pointer; 
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(0,168,150,0.2);
        }
        #btnMasuk:active { transform: scale(0.97); }
        #btnMasuk:disabled { background: #b2bec3; box-shadow: none; }
        
        #msg { margin-top: 15px; font-size: 13px; padding: 12px; border-radius: 10px; display: none; text-align: center; }
        .info { background: #e0f2f1; color: #00796b; border: 1px solid #b2dfdb; }
        .err { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        
        /* Animasi Loading Sederhana */
        .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>KLINIK SEHAT</h1>
        <p>Portal Absensi & Login Perawat</p>
    </div>
    <div class="content">
        <div class="input-group">
            <label>ID ATAU NAMA PERAWAT</label>
            <input type="text" id="nama" placeholder="Contoh: Ners Amanda" autocomplete="off">
        </div>
        <button id="btnMasuk">MASUK</button>
        <div id="msg"></div>
    </div>
</div>

<script>
    // --- KONFIGURASI ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-06WTIG3kzJrF2i6VBrdpOhNcka-5amNnN0nXiO2bSJwXrBG21-iaGGANlUeDlZWr/exec";
    const REDIRECT_URL = "login.html"; // Ganti dengan URL login atau dashboard Anda
    
    const btn = document.getElementById('btnMasuk');
    const msg = document.getElementById('msg');
    const inputNama = document.getElementById('nama');

    btn.addEventListener('click', () => {
        const nama = inputNama.value.trim();
        if (!nama) { 
            showMsg("⚠️ Silakan masukkan nama Anda", "err"); 
            return; 
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Memverifikasi Lokasi...';
        showMsg("Sedang mengamankan koneksi GPS...", "info");

        navigator.geolocation.getCurrentPosition(async (pos) => {
            try {
                // Mengirim data ke Google Sheets
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        nama: nama,
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    })
                });
                
                showMsg("✅ Lokasi terverifikasi. Mengalihkan...", "info");
                
                // Jeda 1.5 detik agar user bisa melihat status sukses sebelum pindah halaman
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, 1500);

            } catch (e) {
                showMsg("❌ Gagal terhubung ke server", "err");
                btn.disabled = false;
                btn.textContent = "MASUK";
            }
        }, (err) => {
            showMsg("❌ Gagal: Mohon aktifkan GPS perangkat", "err");
            btn.disabled = false;
            btn.textContent = "MASUK";
        }, { 
            enableHighAccuracy: true,
            timeout: 10000 
        });
    });

    function showMsg(txt, type) {
        msg.style.display = "block";
        msg.className = type;
        msg.textContent = txt;
    }
</script>

</body>
</html>
