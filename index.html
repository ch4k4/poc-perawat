<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Presensi Klinik - Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #eef2f7; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-card { background: white; width: 90%; max-width: 400px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        .header { background: #00a896; color: white; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 20px; }
        .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
        .content { padding: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { background: #00a896; color: white; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        button:active { transform: scale(0.98); }
        button:disabled { background: #ccc; }
        #msg { margin-top: 15px; font-size: 13px; padding: 10px; border-radius: 8px; display: none; text-align: center; }
        .info { background: #e0f2f1; color: #00796b; }
        .err { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <h1>Klinik Sehat Digital</h1>
        <p>Verifikasi Kehadiran Perawat</p>
    </div>
    <div class="content">
        <div class="input-group">
            <label>Nama Lengkap Perawat</label>
            <input type="text" id="nama" placeholder="Masukkan nama Anda">
        </div>
        <button id="btnKirim">KONFIRMASI LOKASI</button>
        <div id="msg"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz-06WTIG3kzJrF2i6VBrdpOhNcka-5amNnN0nXiO2bSJwXrBG21-iaGGANlUeDlZWr/exec";
    const btn = document.getElementById('btnKirim');
    const msg = document.getElementById('msg');

    btn.addEventListener('click', () => {
        const nama = document.getElementById('nama').value;
        if (!nama) { alert("Silakan isi nama terlebih dahulu"); return; }

        btn.disabled = true;
        showMsg("Mencari sinyal GPS...", "info");

        navigator.geolocation.getCurrentPosition(async (pos) => {
            showMsg("Mengirim data ke sistem...", "info");
            
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({
                        nama: nama,
                        latitude: pos.coords.latitude,
                        longitude: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    })
                });
                
                showMsg("✅ Absensi Berhasil Dicatat!", "info");
                btn.textContent = "TERKIRIM";
            } catch (e) {
                showMsg("❌ Gagal mengirim data", "err");
                btn.disabled = false;
            }
        }, (err) => {
            showMsg("Gagal akses lokasi. Pastikan GPS aktif.", "err");
            btn.disabled = false;
        }, { enableHighAccuracy: true });
    });

    function showMsg(txt, type) {
        msg.style.display = "block";
        msg.className = type;
        msg.textContent = txt;
    }
</script>

</body>
</html>
