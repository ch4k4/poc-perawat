<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoC GPS Log - GitHub API</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: white; width: 100%; max-width: 400px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        h2 { color: #333; margin-bottom: 10px; font-size: 20px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        #btnMasuk { background-color: #24292e; color: white; border: none; padding: 14px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; }
        #btnMasuk:disabled { background-color: #999; }
        #status { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
        .loading { background: #e1f5fe; color: #0288d1; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error { background: #ffebee; color: #c62828; }
    </style>
</head>
<body>

<div class="card">
    <h2>Sistem Log Lokasi</h2>
    <p>Klik tombol di bawah untuk mencatat lokasi Anda ke file log GitHub.</p>
    
    <button id="btnMasuk">KIRIM LOKASI KE GITHUB</button>
    <div id="status"></div>
</div>

<script>
    // --- KONFIGURASI GITHUB (WAJIB DIISI) ---
    const GITHUB_TOKEN = "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";
    const REPO_OWNER = "ch4k4";
    const REPO_NAME = "poc-perawat";
    const FILE_PATH = "log_lokasi.txt"; 

    const btn = document.getElementById('btnMasuk');
    const statusDiv = document.getElementById('status');

    btn.addEventListener('click', () => {
        if (!navigator.geolocation) {
            showStatus("Browser tidak mendukung GPS", "error");
            return;
        }

        btn.disabled = true;
        showStatus("Mengambil GPS...", "loading");

        navigator.geolocation.getCurrentPosition(async (pos) => {
            const { latitude, longitude, accuracy } = pos.coords;
            showStatus("GPS didapat, mengunggah ke GitHub...", "loading");
            
            await simpanKeGithub(latitude, longitude, accuracy);
        }, (err) => {
            showStatus("Gagal ambil lokasi: " + err.message, "error");
            btn.disabled = false;
        }, { enableHighAccuracy: true });
    });

    async function simpanKeGithub(lat, lng, acc) {
        // const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/${FILE_PATH}`;
        const timestamp = new Date().toLocaleString('id-ID');
        const barisBaru = `Waktu: ${timestamp} | Lat: ${lat} | Lng: ${lng} | Acc: ${acc.toFixed(1)}m\n`;

        try {
            let sha = "";
            let kontenLama = "";

            // 1. Ambil file lama jika ada (untuk mendapatkan SHA)
            const getRes = await fetch(url, {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });

            if (getRes.ok) {
                const data = await getRes.json();
                sha = data.sha;
                kontenLama = atob(data.content); // Decode Base64 ke Teks
            }

            // 2. Gabungkan data & Encode ke Base64 (Syarat GitHub API)
            const kontenFinal = btoa(unescape(encodeURIComponent(kontenLama + barisBaru)));

            // 3. Update File
            const putRes = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: "Log lokasi otomatis",
                    content: kontenFinal,
                    sha: sha 
                })
            });

            if (putRes.ok) {
                showStatus("Berhasil! Data tersimpan di log_lokasi.txt", "success");
                btn.textContent = "TERKIRIM";
            } else {
                const errData = await putRes.json();
                showStatus("Gagal Simpan: " + errData.message, "error");
                btn.disabled = false;
            }

        } catch (error) {
            showStatus("Error koneksi API", "error");
            btn.disabled = false;
        }
    }

    function showStatus(text, type) {
        statusDiv.style.display = "block";
        statusDiv.className = type;
        statusDiv.textContent = text;
    }
</script>

</body>
</html>
