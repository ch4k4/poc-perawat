<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Klinik Sehat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
<!-- Update CSS di admin.html -->
<style>
    body { 
        font-family: 'Poppins', sans-serif; 
        background-color: transparent; /* Supaya menyatu dengan dashboard */
        margin: 0; 
        padding: 10px; 
    }
    .container { 
        max-width: 100%; /* Lebar penuh mengikuti frame */
        box-shadow: none; /* Hilangkan shadow agar tidak double */
        border: 1px solid #eee;
    }
</style>
</head>
<body>

<div class="container">
    <button class="btn-refresh" onclick="muatData()">Refresh Data</button>
    <h2>Log Kehadiran Perawat</h2>
    <table id="tabelLog">
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Nama Perawat</th>
                <th>Koordinat</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwd_WAWGaqav6lOCT24-LUDiCH2rcDhMnOZl55WQpSb2Kc20X976l2Hc1t6rySfXgdu/exec";

    async function muatData() {
        const response = await fetch(SCRIPT_URL + "?action=read");
        const data = await response.json();
        const tbody = document.querySelector("#tabelLog tbody");
        tbody.innerHTML = "";

        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.waktu}</td>
                <td>${row.nama}</td>
                <td>${row.lat}, ${row.lng}</td>
                <td><a href="https://www.google.com/maps?q=${row.lat},${row.lng}" target="_blank">Lihat Peta</a></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Muat data automatik semasa buka halaman
    window.onload = muatData;
</script>
</body>
</html>
