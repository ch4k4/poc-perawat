<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Klinik Sehat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        h2 { color: #00a896; border-bottom: 2px solid #e0f2f1; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th { background: #00a896; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f9f9f9; }
        .btn-refresh { background: #00a896; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; }
    </style>
</head>
<body>

<div class="container">
    <button class="btn-refresh" onclick="muatData()">Refresh Data</button>
    <h2>Log Kehadiran Perawat</h2>
    <table id="tabelLog">
        <thead>
            <tr>
                <th>Waktu</th>
                <th>Nama Perawat</th>
                <th>Koordinat</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwd_WAWGaqav6lOCT24-LUDiCH2rcDhMnOZl55WQpSb2Kc20X976l2Hc1t6rySfXgdu/exec";

    async function muatData() {
        const response = await fetch(SCRIPT_URL + "?action=read");
        const data = await response.json();
        const tbody = document.querySelector("#tabelLog tbody");
        tbody.innerHTML = "";

        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.waktu}</td>
                <td>${row.nama}</td>
                <td>${row.lat}, ${row.lng}</td>
                <td><a href="https://www.google.com/maps?q=${row.lat},${row.lng}" target="_blank">Lihat Peta</a></td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Muat data automatik semasa buka halaman
    window.onload = muatData;
</script>
</body>
</html>
